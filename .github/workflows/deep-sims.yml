# The deep simulation tests: every triple of features meeting in a few hundred towns, with a new random seed each
# week (the seed is in the report, so any failing town replays exactly). Weekly, and by hand from the Actions tab.
name: Deep simulations

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  deep:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        shell: pwsh
        run: dotnet build Doodlefolk.csproj -c Release -nologo -v q -o "$env:RUNNER_TEMP/build"

      - name: Every triple of features
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "sims"
          $p = Start-Process (Join-Path $env:RUNNER_TEMP "build/Doodlefolk.exe") -ArgumentList "--simtest", "deep", "--warp", "--out", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(3300000)) { $p.Kill(); throw "didn't finish" }
          New-Item -ItemType Directory -Force ci-output | Out-Null
          Copy-Item (Join-Path $out "*") ci-output -Recurse -ErrorAction SilentlyContinue
          Get-Content (Join-Path $out "simtest-report.txt") -Encoding UTF8
          exit $p.ExitCode

      - name: Keep the report and the logs of any failing towns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-simulations
          path: ci-output/
          if-no-files-found: ignore
