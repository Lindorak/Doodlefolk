# Doodlefolk's checks on GitHub (free for public repositories): the same script you can run at home,
# tools/ci.ps1. Runs on every push and pull request, and can be started by hand from the Actions tab.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, unit tests, Studio page tests and the self-test
        shell: pwsh
        run: ./tools/ci.ps1

      - name: Keep the self-test's report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: ci-output/
          if-no-files-found: ignore
